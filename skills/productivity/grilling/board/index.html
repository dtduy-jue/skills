<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grilling board</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1f2328; --muted: #5f6670; --line: #dcdfe3;
    --accent: #b45309; --accent-soft: #fdf3e3; --good: #16794c; --good-soft: #e7f5ee; --open: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c; --card: #212429; --text: #e8eaed; --muted: #a2a9b3; --line: #383c43;
      --accent: #f0a544; --accent-soft: #3a2c17; --good: #4cc38a; --good-soft: #17322a; --open: #9aa1ab;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.3; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  h3 { font-size: 20px; margin: 0 0 8px; line-height: 1.35; }
  p { margin: 0 0 10px; }
  p:last-child { margin-bottom: 0; }
  .meta { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 14px; }
  .current { border: 2px solid var(--accent); }
  .label { font-weight: 600; }
  .option { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .option.picked { border-color: var(--accent); background: var(--accent-soft); }
  .tag { font-size: 12px; font-weight: 600; color: var(--accent); margin-left: 6px; }
  .example { color: var(--muted); font-size: 15px; }
  .reco { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
  .diagram { overflow: auto; margin-top: 10px; }
  .diagram svg { display: block; margin: 0 auto; }
  .diagram .node { cursor: pointer; }
  .tools { float: right; }
  button { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
  .detail { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .settled { color: var(--good); font-weight: 600; }
  .waiting { color: var(--open); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .grid .card { margin-top: 14px; }
  #banner { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div id="banner"></div>
  <div id="app"><p class="meta">Waiting for board.js in this folder.</p></div>
</main>
<script>
  const STYLES = { settled: "fill:#16794c,stroke:#16794c,color:#fff", current: "fill:#b45309,stroke:#b45309,color:#fff", open: "fill:#6b7280,stroke:#6b7280,color:#fff" };
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral" });

  let last = null, zoom = 1, selected = null, renderCount = 0;

  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    Object.assign(node, attrs);
    for (const kid of kids) if (kid !== undefined && kid !== null && kid !== "") node.append(kid);
    return node;
  }
  const para = (text, className) => (text ? el("p", { className }, text) : null);
  const treeLabel = (text) => String(text).replace(/"/g, "#quot;").replace(/\n/g, " ");

  function treeSource(decisions) {
    const ids = new Map(decisions.map((d, i) => [d.id, "n" + i]));
    const lines = ["flowchart TD"];
    decisions.forEach((d, i) => {
      lines.push(`n${i}["${treeLabel(d.title)}"]`);
      lines.push(`style n${i} ${STYLES[d.status] || STYLES.open}`);
      if (d.parent && ids.has(d.parent)) lines.push(`${ids.get(d.parent)} --> n${i}`);
    });
    return lines.join("\n");
  }

  function applyZoom(graphic) {
    graphic.style.width = graphic.viewBox.baseVal.width * zoom + "px";
  }

  async function drawDiagram(host, source, onNodeClick) {
    if (!window.mermaid) { host.append(para("Diagrams need internet access. The lists on this page still hold everything.", "meta")); return; }
    try {
      const { svg } = await mermaid.render("d" + ++renderCount, source);
      host.innerHTML = svg;
      const graphic = host.querySelector("svg");
      graphic.style.maxWidth = onNodeClick ? "none" : "100%";
      if (onNodeClick) applyZoom(graphic);
      else graphic.style.width = graphic.viewBox.baseVal.width + "px";
      if (onNodeClick) host.querySelectorAll(".node").forEach((node) => {
        const match = node.id.match(/flowchart-n(\d+)-/);
        if (match) node.addEventListener("click", () => onNodeClick(Number(match[1])));
      });
    } catch (error) {
      host.append(el("pre", {}, source));
    }
  }

  function questionCard(q, index, total) {
    const heading = total > 1 ? `Decision ${index + 1} of ${total}` : "Your decision right now";
    const card = el("section", { className: "card current" }, el("h2", {}, heading), el("h3", {}, q.title));
    card.append(...[para(q.why), para(q.ask, "label"), para(q.example, "example")].filter(Boolean));
    if (q.diagram) {
      const host = el("div", { className: "diagram" });
      card.append(host);
      drawDiagram(host, q.diagram);
    }
    for (const option of q.options || []) {
      card.append(el("div", { className: "option" + (option.recommended ? " picked" : "") },
        el("div", {}, el("span", { className: "label" }, option.label), option.recommended ? el("span", { className: "tag" }, "RECOMMENDED") : null),
        para(option.summary),
        para(option.example, "example")));
    }
    if (q.recommendation) card.append(el("div", { className: "reco" }, el("span", { className: "label" }, "Recommendation: "), q.recommendation));
    return card;
  }

  function detail(decision) {
    if (!decision) return para("Click a box to see what it means.", "meta");
    const status = { settled: "Settled", current: "Being decided now", open: "Still open" }[decision.status] || "Still open";
    return el("div", {}, el("div", { className: "label" }, decision.title + " (" + status + ")"), para(decision.answer), para(decision.why, "example"));
  }

  function mapCard(decisions) {
    const host = el("div", { className: "diagram" });
    const info = el("div", { className: "detail" }, detail(decisions.find((d) => d.id === selected)));
    const resize = (factor) => {
      zoom = Math.min(4, Math.max(0.4, zoom * factor));
      const graphic = host.querySelector("svg");
      if (graphic) applyZoom(graphic);
    };
    const tools = el("div", { className: "tools" }, el("button", { onclick: () => resize(1 / 1.25) }, "-"), " ", el("button", { onclick: () => resize(1.25) }, "+"));
    drawDiagram(host, treeSource(decisions), (index) => {
      selected = decisions[index].id;
      info.replaceChildren(detail(decisions[index]));
    });
    return el("section", { className: "card" }, tools, el("h2", {}, "Decision map"), host, info);
  }

  function listCard(title, decisions, render) {
    if (!decisions.length) return null;
    return el("section", { className: "card" }, el("h2", {}, title), el("ul", {}, ...decisions.map((d) => el("li", {}, ...render(d)))));
  }

  function render(board) {
    const decisions = board.decisions || [];
    const settled = decisions.filter((d) => d.status === "settled");
    const open = decisions.filter((d) => d.status === "open");
    document.title = (board.topic || "Grilling") + " board";
    const scroll = window.scrollY;
    const grid = el("div", { className: "grid" });
    const parts = [
      listCard("Settled so far", settled, (d) => [el("div", { className: "settled" }, d.title), para(d.answer), para(d.why, "example")]),
      listCard("Still to decide", open, (d) => [el("div", { className: "waiting" }, d.title), para(d.why, "example")]),
    ].filter(Boolean);
    grid.append(...parts);
    const app = document.getElementById("app");
    app.replaceChildren(
      el("header", {}, el("h1", {}, board.topic || "Grilling"),
        el("div", { className: "meta" }, `${board.project || ""} · round ${board.round ?? "?"} · ${settled.length} settled, ${open.length} still open`)),
      el("section", { className: "card" }, el("h2", {}, "Where we are"), para(board.goal, "label"), para(board.whereWeAre)),
      ...(board.questions || []).map((q, index, all) => questionCard(q, index, all.length)),
      ...(decisions.length ? [mapCard(decisions)] : []),
      grid,
      ...(board.terms && board.terms.length ? [listCard("Words used here", board.terms, (t) => [el("span", { className: "label" }, t.term + ": "), t.meaning])] : []));
    window.scrollTo(0, scroll);
  }

  function setBanner(text) {
    const banner = document.getElementById("banner");
    banner.textContent = text;
    banner.style.display = text ? "block" : "none";
  }

  function poll() {
    const script = document.createElement("script");
    script.src = "board.js?t=" + Date.now();
    script.onload = () => {
      script.remove();
      setBanner("");
      const text = JSON.stringify(window.BOARD);
      if (window.BOARD && text !== last) { last = text; render(window.BOARD); }
    };
    script.onerror = () => {
      script.remove();
      if (last) setBanner("The board data is gone, so this grilling session has ended. You can close this tab.");
    };
    document.head.append(script);
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
